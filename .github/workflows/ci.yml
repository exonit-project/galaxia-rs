# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: "Clippy (warnings allowed; C++-compatibility idioms)"
        run: cargo clippy --all-targets

      - name: "Build (default features: CPU fp64 only)"
        run: cargo build --release

      # GALAXIA_DATA_DIR is intentionally NOT set: tests that need the (non-redistributable)
      # GalaxiaData are reported as "NOT SELECTED" and skipped. Run them locally, see README.
      - name: Test (data-free tests)
        run: cargo test --release
