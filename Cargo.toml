[package]
name = "galaxia-rs"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Rust port of the Galaxia 0.7.2 Milky Way synthetic stellar population code (CPU fp64 supported; GPU backends experimental)"
readme = "README.md"
keywords = ["astronomy", "galaxy", "synthetic-survey", "stellar-population"]
categories = ["science"]
authors = ["Marc Balcells"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
# Only needed by the EXPERIMENTAL GPU backends (dynamic loading of CUDA / OpenCL libraries).
libloading = { version = "0.9.0", optional = true }

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[features]
# The default build is CPU-only (fp64): the only supported and validated configuration.
default = []
# EXPERIMENTAL, NOT VALIDATED, NOT FOR SCIENCE: GPU backends (see README, Limitations).
cuda = ["dep:libloading"]
opencl = ["dep:libloading"]

[lib]
name = "galaxia_rs"
path = "src/lib.rs"

[[bin]]
name = "galaxia-rs"
path = "src/main.rs"
